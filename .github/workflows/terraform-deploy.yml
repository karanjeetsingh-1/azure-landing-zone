name: Deploy Azure Landing Zone (Dev)

on:
  push:
    branches: [ "main" ]
  pull_request: # Step 11: Feature branch till terraform plan
    branches: [ "main" ]

env:
  # Setting the working directory based on your folder structure
  TF_WORKING_DIR: 'azure-landing-zone/environment/dev'
  
  # Standard Azure authentication variables required for the azurerm provider
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  # Step 10: terraform init, fmt, validate, plan
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

  # Steps 12, 13 & 14: Manual approval and auto-approve apply
  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: terraform-plan
    
    # This environment tag is what enforces Step 12 (Manual approval)
    environment: dev-approval 
    
    # We generally only want to apply changes when merged to main, not on feature branch PRs 
    if: github.ref == 'refs/heads/main' 
    
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Re-initializing and planning in the new job runner to ensure state matches
      - name: Terraform Init
        run: terraform init
        
      - name: Terraform Format
        run: terraform fmt

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan